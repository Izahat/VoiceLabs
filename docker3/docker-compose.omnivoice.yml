# ============================================
# Docker Compose — OmniVoice TTS Service
# ============================================
# Сначала скачивает модель OmniVoice в volume, потом запускает сервер.
# Модель скачивается один раз и сохраняется в именованный volume.
#
# Использование:
#   docker compose -f docker3/docker-compose.omnivoice.yml up -d
# ============================================

services:
  # === Скачивание модели OmniVoice с HuggingFace ===
  # Запускается один раз, скачивает модель k2-fsa/OmniVoice в именованный volume.
  # При повторном запуске проверяет наличие модели и пропускает скачивание.
  model-downloader:
    image: python:3.11-slim
    container_name: dublaj-omnivoice-model-downloader
    restart: "no"
    volumes:
      - omnivoice-model-data:/models
    command: >
      bash -c "
        if [ -f /models/OmniVoice/config.json ]; then
          echo 'Модель OmniVoice уже скачана, пропускаем скачивание';
        else
          echo 'Начинаем скачивание модели OmniVoice...';
          pip install huggingface_hub -q &&
          python3 -c 'from huggingface_hub import snapshot_download; print(\"Скачиваем OmniVoice...\"); snapshot_download(\"k2-fsa/OmniVoice\", local_dir=\"/models/OmniVoice\"); print(\"Модель скачана!\")';
        fi
      "

  # === OmniVoice TTS сервер ===
  # Использует модель из volume, требует GPU (NVIDIA CUDA).
  # Ждёт завершения model-downloader перед запуском.
  omnivoice:
    build:
      context: ..
      dockerfile: docker3/Dockerfile.omnivoice
    container_name: dublaj-omnivoice
    ports:
      - "8200:8200"
    volumes:
      - omnivoice-model-data:/models
    environment:
      - MODEL_PATH=/models/OmniVoice
      - DEVICE=cuda
    restart: unless-stopped
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# Именованный volume для хранения модели между перезапусками
volumes:
  omnivoice-model-data:
